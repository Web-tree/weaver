  14-run-task-with-args:
    stage: implemented
  15-node-npm-ensures:
    stage: implemented
  16-go-module-management:
    stage: pending
  17-rust-cargo-management:
    stage: pending
  23-ai-agents-skills-and-agents-md:
    stage: implemented
  # Plain-text sibling of 23: `ensure.text.section` on a non-markdown file with a
  # `#`-comment marker. Pending until the section primitive accepts a configurable
  # comment leader. Flip to `implemented` once `before/` converges to `after/`.
  30-tmux-claude-window-rename:
    stage: pending
    custom_assertions:
      - type: file_contains
        path: "home/.tmux.conf"
        value: '#{s/^[^ ]* //:pane_title}'
      - type: file_contains
        path: "home/.tmux.conf"
        value: 'rw:section id="tmux-claude-rename"'
  # `ensure.fs.symlink` via a module-scoped `type: fs.symlink` plugin ensure,
  # resolved through the `plugins: fs-symlink: path: ...` override (see
  # PluginResolver::resolve_ensure_type in crates/core/src/plugin/resolver.rs).
  # Manually verified to converge for real with `wvr apply` run directly from
  # this directory (relocates `src` to `dst`, symlinks it back, idempotent on
  # re-run). Stays `pending` here only because this harness copies each
  # example into an isolated tempdir (see `run_example`/`copy_dir` below),
  # which breaks the `path: "../../../plugins/fs-symlink"` reference — it
  # points outside the copied `examples/31-fs-symlink-relocate/` subtree, so
  # `PluginSource::Local` can't find `plugin.wasm` under this harness. See
  # examples/31-fs-symlink-relocate/README.md "Known limitations".
  31-fs-symlink-relocate:
    stage: pending
