defaults:
  stage: pending
  args: ["apply", "--auto-approve"]
  ignore_paths:
    - weaver.lock
    - .rw/state.yaml

examples:
  01-basic-static-files:
    stage: implemented
  02-template-rendering:
    stage: implemented
  03-mixed-files-and-templates:
    stage: implemented
  04-multiple-apps:
    stage: implemented
  05-nested-folders:
    stage: implemented
  06-config-includes:
    stage: implemented
  07-multiple-modules:
    stage: implemented
  08-module-update:
    stage: implemented
  09-drift-detection:
    stage: implemented
    args: ["apply", "--strategy", "overwrite", "--auto-approve"]
  10-template-conditionals:
