[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/ops",
    "crates/test-support",
    "plugins/aws-ssm",
    "plugins/npm-script",
    "plugins/ai-patch",
    "plugins/go-dep",
    "plugins/cargo-dep",
    "plugins/terraform-fmt",
    "plugins/k8s-apply",
    "plugins/taskfile-task",
    "plugins/fs-symlink",
]
default-members = ["crates/cli", "crates/core", "crates/ops"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Web-tree/weaver"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.2"
dialoguer = "0.12.0"
indicatif = "0.18.3"
tera = "1.19.1"
wasmtime = { version = "44.0.0", features = ["component-model"] }
wasmtime-wasi = "44.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.148", features = ["preserve_order"] }
serde_yml = "0.0.13"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "fmt",
    "json",
] }
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.24.0"
walkdir = "2.4.0"
flate2 = "1.1"
semver = "1.0"
tar = "0.4"
weaver-core = { path = "crates/core" }
weaver-ops = { path = "crates/ops" }
weaver-test-support = { path = "crates/test-support" }

# Profile used for published binaries: smaller and faster than `release`
# without slowing down day-to-day `cargo build --release`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
